[package]
name = "phonehome"
version = "0.1.0"
edition = "2021"
description = "BYOB Telegram remote for any AI CLI backend"
license = "MIT"

[[bin]]
name = "phonehome"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"
dirs = "5"
glob = "0.3"
async-trait = "0.1"
regex = "1"
